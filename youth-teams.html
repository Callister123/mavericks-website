<!doctype html>
<html lang="en">
  <head>
    <meta
      name="description"
      content="Milton Keynes futsal club offering community programs, player development, team fixtures, and club activities. Explore updates, join the team, and be part of our growing community."
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MK Mavericks Futsal Club</title>
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="icon" type="image/png" href="images/favicon.png" />
  </head>

  <body>
    <!-- ===========================
    Header / Navigation
    ============================ -->
    <div id="navbar"></div>

    <!-- Hero Section -->
    <section class="section">
      <h2>Youth Squad</h2>

      <div class="card" style="text-align: center">
        <img
          src="images/youth-teams-squad.jpeg"
          alt="Youth team squad posing together on an indoor futsal court in club shirts with a focused, determined team spirit"
          style="width: 100%; border-radius: 8px; margin-bottom: 1rem"
        />
        <p>
          The Mavericks Youth Squad is dedicated to developing the next
          generation of futsal talent.
        </p>
      </div>
    </section>

    <!-- Staff Section -->
    <section class="section">
      <h2>Staff</h2>

      <div class="cards">
        <div class="card">
          <h3>Head Coach</h3>
          <p>Flavio Damasio</p>
        </div>

        <div class="card">
          <h3>Assistant Coach</h3>
          <p>N/A</p>
        </div>

        <div class="card">
          <h3>Team Physio</h3>
          <p>N/A</p>
        </div>

        <div class="card">
          <h3>Team Manager</h3>
          <p>Flavio Damasio</p>
        </div>
      </div>
    </section>

    <!-- ===========================
    Footer
    ============================ -->
    <footer id="footer"></footer>
    <script>
      // Load navbar
      fetch("partials/navbar.html")
        .then((res) => res.text())
        .then((html) => {
          const navbarContainer = document.getElementById("navbar");
          navbarContainer.innerHTML = html;

          // Force JS to load AFTER DOM update
          setTimeout(() => {
            const script = document.createElement("script");
            script.src = "js/navbar.js";
            document.body.appendChild(script);
          }, 0);
        });

      // Load footer
      fetch("partials/footer.html")
        .then((res) => res.text())
        .then((html) => (document.getElementById("footer").innerHTML = html));
    </script>
  </body>
</html>
