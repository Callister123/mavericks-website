<!doctype html>
<html lang="en">
  <head>
    <meta
      name="description"
      content="Meet the Mavericks Women's First Team competing across the UK. Check fixtures, results and updates from our growing women's futsal programme."

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Women's Team | MK Mavericks Sports Club</title>
    <link rel="stylesheet" href="css/theme.css" />

    <link rel="stylesheet" href="css/home.css" />

    Header / Navigation
    ============================ -->

            <h3>Assistant Coach</h3>

          <div class="card">
