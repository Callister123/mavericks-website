<!doctype html>
<html lang="en">
  <head>
    <meta
      name="description"
      content="Meet the Mavericks Women's First Team competing across the UK. Check fixtures, results and updates from our growing women's futsal programme."
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MK Mavericks Futsal Club</title>
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link

      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"

    Header / Navigation
    ============================ -->
    <div id="navbar"></div>

    <section class="section">

          src="images/womens-team-squad.jpeg"
          alt="Women's team squad posing together on an indoor futsal court in club shirts with a focused, determined team spirit"

        />
        <p>
          The Mavericks Women's Team competes at the highest level of regional
          futsal, combining experience, pace, and technical quality.
        </p>
      </div>
    </section>

    <!-- Staff Section -->
    <section class="section">

      <div class="cards">
        <div class="card">
          <h3>Head Coach</h3>

        <div class="card">
          <h3>Assistant Coach</h3>
          <p>N/A</p>
        </div>

        <div class="card">
          <h3>Team Physio</h3>
          <p>N/A</p>
        </div>

        <div class="card">
          <h3>Team Manager</h3>
          <p>Flavio Damasio</p>
        </div>

    </section>

    <!-- ===========================
    Footer
    ============================ -->
    <footer id="footer"></footer>
