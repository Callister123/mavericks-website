<!doctype html>
<html lang="en">
  <head>
    <meta
      name="description"
      content="Read the latest Mavericks Futsal Club articles, match reports, news updates and community stories. Explore featured content and in-depth coverage across all teams."
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Article | MK Mavericks Sports Club</title>
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="icon" type="image/png" href="images/favicon.png" />
  </head>

  <body>
    <!-- ===========================
    Header / Navigation
    ============================ -->
    <div id="navbar"></div>

    <!-- ===========================
    Article Section
    ============================ -->
    <section class="article-section">
      <div class="article-container">
        <h1 class="article-title"></h1>
        <img class="article-image" alt="" hidden />
        <div class="article-content"></div>
      </div>
    </section>

    <div id="footer"></div>

    <script src="js/global.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");

      const titleEl = document.querySelector(".article-title");
      const imageEl = document.querySelector(".article-image");
      imageEl.hidden = false;
      const contentDiv = document.querySelector(".article-content");

      // Escape the text, then turn web addresses into links
      function linkify(text) {
        const safe = text
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
        return safe.replace(
          /(https?:\/\/[^\s)]+)/g,
          '<a href="$1" target="_blank" rel="noopener noreferrer">$1</a>',
        );
      }

      function showNotFound() {
        titleEl.textContent = "Article Not Found";
        document.title = "Article Not Found | MK Mavericks Sports Club";
        imageEl.hidden = true;
      }

      fetch("data/articles.json")
        .then((res) => res.json())
        .then((articles) => {
          const article = articles.find((a) => a.id === id);
          if (!article) return showNotFound();

          document.title = `${article.title} | MK Mavericks Sports Club`;
          document
            .querySelector('meta[name="description"]')
            ?.setAttribute("content", article.summary);
          titleEl.textContent = article.title;
          imageEl.src = article.image;
          imageEl.alt = article.title;

          article.content.forEach((paragraph) => {
            const p = document.createElement("p");
            p.innerHTML = linkify(paragraph);
            contentDiv.appendChild(p);
          });
        })
        .catch((err) => {
          console.error("Could not load article:", err);
          showNotFound();
        });
    </script>
  </body>
</html>
