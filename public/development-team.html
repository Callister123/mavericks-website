<!doctype html>
<html lang="en">
  <head>
    <meta
      name="description"
      content="Discover the Mavericks Men's Development Team, supporting player growth and progression through structured coaching and competitive futsal."

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Development Team | MK Mavericks Sports Club</title>

        <div class="card">
