<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MK Mavericks Futsal Club</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/theme.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="icon" type="image/png" href="images/favicon.png" />
  </head>

  <body>
    <!-- ===========================
    Header / Navigation
    ============================ -->
    <div id="navbar"></div>

    <!-- ===========================
    Article Section
    ============================ -->
    <section class="article-section">
      <div class="article-container">
        <h1 class="article-title"></h1>
        <img class="article-image" src="" alt="" />
        <div class="article-content"></div>
      </div>
    </section>
    <!-- ===========================
    Footer
    ============================ -->
    <div id="footer"></div>

    <script>
      // Load navbar
      fetch("partials/navbar.html")
        .then((res) => res.text())
        .then((html) => {
          document.getElementById("navbar").innerHTML = html;
          // Load navbar JS AFTER navbar is injected
          const script = document.createElement("script");
          script.src = "js/navbar.js";
          document.body.appendChild(script);
        });

      // Load footer
      fetch("partials/footer.html")
        .then((res) => res.text())
        .then((html) => (document.getElementById("footer").innerHTML = html));

      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");

      fetch("articles.json")
        .then((res) => res.json())
        .then((articles) => {
          const article = articles.find((a) => a.id === id);

          if (!article) {
            document.querySelector(".article-title").innerText =
              "Article Not Found";
            return;
          }

          document.querySelector(".article-title").innerText = article.title;
          document.querySelector(".article-image").src = article.image;

          const contentDiv = document.querySelector(".article-content");
          article.content.forEach((paragraph) => {
            const p = document.createElement("p");
            p.innerText = paragraph;
            contentDiv.appendChild(p);
          });
        });
    </script>
  </body>
</html>
