<!doctype html>
<html lang="en">
  <head>
    <meta
      name="description"
      content="Explore Mavericks Futsal Club teams, including men's, women's and youth squads. See pathways for development and competitive futsal across the UK."
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MK Mavericks Futsal Club</title>
    <link rel="stylesheet" href="css/theme.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="icon" type="image/png" href="images/favicon.png" />
  </head>

  <body>
    <!-- ===========================
    Header / Navigation
    ============================ -->
    <div id="navbar"></div>

    <!-- ===========================
    Teams Section
    ============================ -->
    <section class="section">
      <h2>Our Teams</h2>

      <div class="cards">
        <article class="card" onclick="location.href = 'first-team.html'">
          <h3>First Team</h3>
          <p>Competing in the regional futsal league.</p>
        </article>

        <article class="card" onclick="location.href = 'development-team.html'">
          <h3>Development Squad</h3>
          <p>Focused on player growth and skills.</p>
        </article>

        <article class="card" onclick="location.href = 'womens-team.html'">
          <h3>Women's Team</h3>
          <p>Competing in UK National Tier 1 futsal.</p>
        </article>

        <article class="card" onclick="location.href = 'youth-teams.html'">
          <h3>Youth Squad</h3>
          <p>Introducing young talent to the world of futsal.</p>
        </article>

        <article
          class="card"
          onclick="location.href = 'https://fridayleague.mavericksfutsal.club/'"
          target="_blank"
        >
          <h3>Friday League</h3>
          <p>Casual play and community engagement.</p>
        </article>
      </div>
    </section>

    <!-- ===========================
    Footer
    ============================ -->
    <footer id="footer"></footer>
    <script>
      // Load navbar
      fetch("partials/navbar.html")
        .then((res) => res.text())
        .then((html) => {
          const navbarContainer = document.getElementById("navbar");
          navbarContainer.innerHTML = html;

          // Force JS to load AFTER DOM update
          setTimeout(() => {
            const script = document.createElement("script");
            script.src = "js/navbar.js";
            document.body.appendChild(script);
          }, 0);
        });

      // Load footer
      fetch("partials/footer.html")
        .then((res) => res.text())
        .then((html) => (document.getElementById("footer").innerHTML = html));
    </script>
  </body>
</html>
